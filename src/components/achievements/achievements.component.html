<div class="flex flex-col gap-8 animate-futuristic-fade-in max-w-4xl mx-auto">
  <header>
    <a routerLink="/home" class="inline-flex items-center gap-2 text-sm text-cyan-400 hover:text-cyan-300 transition-colors mb-2">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5"><path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 0 1-.02 1.06L8.832 10l3.938 3.71a.75.75 0 1 1-1.04 1.08l-4.5-4.25a.75.75 0 0 1 0-1.08l4.5-4.25a.75.75 0 0 1 1.06.02Z" clip-rule="evenodd" /></svg>
      Back to Home
    </a>
    <div class="flex justify-between items-center">
        <div>
            <h1 class="text-3xl font-bold text-white text-glow" [style.color]="'var(--theme-color-primary)'">Achievements</h1>
            <p class="text-gray-400">Milestones of your mental journey.</p>
        </div>
        <div class="text-right">
            <p class="text-2xl font-bold" [style.color]="'var(--theme-color-primary)'">{{ unlockedCount() }} / {{ totalCount() }}</p>
            <p class="text-sm text-gray-400">Unlocked</p>
        </div>
    </div>
  </header>

  <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    @for(achievement of achievements(); track achievement.id) {
      <div 
        class="futuristic-card p-5 flex flex-col items-center text-center gap-3 transition-opacity"
        [class.opacity-40]="!achievement.unlocked"
        [class.grayscale]="!achievement.unlocked"
        [style.--card-glow-color]="achievement.unlocked ? 'var(--theme-color-primary)' : '#4b5563'"
        >
        <div class="card-content">
          <div class="relative z-10 flex flex-col items-center">
            <span class="text-6xl">{{ achievement.icon }}</span>
            <h3 class="text-lg font-bold mt-2">{{ achievement.name }}</h3>
            <p class="text-sm text-gray-400">{{ achievement.description }}</p>
          </div>
        </div>
      </div>
    }
  </section>
</div>
