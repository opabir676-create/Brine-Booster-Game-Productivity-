<div class="flex flex-col items-center gap-6">
  @if (gameState() === 'playing') {
    <!-- Header -->
    <header class="w-full grid grid-cols-3 items-center futuristic-card p-4">
      <div class="text-center">
        <p class="text-sm text-gray-400">Score</p>
        <p class="text-2xl font-bold">{{ score() }}</p>
      </div>
      <div class="text-center">
        <p class="text-sm text-gray-400">Time Left</p>
        <p class="text-2xl font-bold">{{ timeLeft() }}s</p>
      </div>
      <div class="text-center">
        <p class="text-sm text-gray-400">Streak</p>
        <p class="text-2xl font-bold">🔥 {{ streak() }}</p>
      </div>
    </header>
    
    <div 
        class="grid gap-2 w-full max-w-lg mx-auto p-2 futuristic-card"
        [style.grid-template-columns]="'repeat(' + getGridCols() + ', 1fr)'">
        @for(item of items(); track item.id) {
            <div 
                class="aspect-square flex items-center justify-center text-4xl cursor-pointer hover:bg-white/10 rounded-md"
                (click)="handleItemClick(item)">
                <span [style.transform]="item.transform" class="inline-block transition-transform">{{ item.icon }}</span>
            </div>
        }
    </div>
  } @else {
     <div class="w-full futuristic-card p-8 text-center min-h-[400px] flex flex-col justify-center items-center">
        <h2 class="text-3xl font-bold text-yellow-400">Time's Up!</h2>
        <p class="text-lg text-gray-300 mt-2">You did a great job focusing!</p>
    </div>
  }
</div>
