<div class="flex flex-col items-center gap-6 max-w-lg mx-auto">
  <!-- Header -->
  <header class="w-full grid grid-cols-3 items-center futuristic-card p-4">
    <div class="text-center">
      <p class="text-sm text-gray-400">Score</p>
      <p class="text-2xl font-bold">{{ score() }}</p>
    </div>
    <div class="text-center">
      <p class="text-sm text-gray-400">Round</p>
      <p class="text-2xl font-bold">{{ round() }}</p>
    </div>
    <div class="text-center">
      <p class="text-sm text-gray-400">Lives</p>
      <div class="flex justify-center gap-1 mt-1">
        @for (i of [].constructor(lives()); track $index) {
          <span class="text-xl" [style.color]="'var(--theme-color-primary)'">♥</span>
        }
        @for (i of [].constructor(3 - lives()); track $index) {
          <span class="text-xl text-gray-600">♥</span>
        }
      </div>
    </div>
  </header>
  
  <!-- Target Shape -->
  <div class="flex flex-col items-center gap-2">
    <h2 class="text-lg font-semibold text-glow" [style.color]="'var(--theme-color-primary)'">Find the Rotated Shape</h2>
    <div class="w-24 h-24 futuristic-card p-2">
       <svg viewBox="0 0 100 100" class="w-full h-full">
         <path [attr.d]="targetShapePath()" stroke="var(--theme-color-primary)" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
       </svg>
    </div>
  </div>

  <!-- Options Grid -->
  <div class="grid grid-cols-2 gap-4 w-full">
    @for(option of options(); track option.id) {
      <button 
        class="aspect-square rounded-lg transition-all duration-200 cursor-pointer flex items-center justify-center p-4 futuristic-card no-hover-transform"
        [class.border-green-400]="feedback() === 'correct' && option.isCorrect"
        [class.border-red-400]="feedback() === 'incorrect' && selectedOptionId() === option.id"
        [class.border-2]="(feedback() === 'correct' && option.isCorrect) || (feedback() === 'incorrect' && selectedOptionId() === option.id)"
        (click)="handleSelection(option)"
        [disabled]="gameState() !== 'playing'">
         <svg viewBox="0 0 100 100" class="w-full h-full">
           <path [attr.d]="option.path" [attr.transform]="option.transform" stroke="white" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
         </svg>
      </button>
    }
  </div>

</div>
