<div class="flex flex-col items-center gap-6 max-w-lg mx-auto">
  <!-- Header -->
  <header class="w-full grid grid-cols-2 items-center futuristic-card p-4">
    <div class="text-center">
      <p class="text-sm text-gray-400">Score</p>
      <p class="text-2xl font-bold">{{ score() }}</p>
    </div>
    <div class="text-center">
      <p class="text-sm text-gray-400">Time Left</p>
      <div class="w-full bg-black/50 rounded-full h-4 mt-1">
        <div class="h-4 rounded-full transition-all duration-500" [style.width.%]="(timeLeft() / 60) * 100" [style.background-color]="'var(--theme-color-primary)'"></div>
      </div>
      <p class="text-lg font-bold">{{ timeLeft() }}s</p>
    </div>
  </header>
  
  <!-- Game Area -->
  <div class="w-full futuristic-card p-8 text-center min-h-[200px] flex flex-col justify-center">
    @if(gameState() === 'playing' && currentColorWord(); as cw) {
      <p class="text-7xl font-bold transition-colors duration-100" [style.color]="cw.colorHex">
        {{ cw.word.toUpperCase() }}
      </p>
    } @else {
      <p class="text-4xl font-bold text-gray-400">Game Over!</p>
    }
  </div>

  <!-- Answer Buttons -->
   @if (gameState() === 'playing') {
    <div class="w-full grid grid-cols-2 md:grid-cols-3 gap-3">
        @for(option of colorOptions; track option.name) {
            <button 
                (click)="handleAnswer(option.hex)"
                class="futuristic-btn text-lg font-bold h-20"
                [style.background-color]="option.hex"
                [style.color]="'#000'"
                [style.text-shadow]="'0 0 5px rgba(255,255,255,0.7)'"
                >
                {{ option.name }}
            </button>
        }
    </div>
  }
</div>
