<nav class="futuristic-card no-hover-transform fixed bottom-4 left-4 right-4 h-[72px] z-40 transition-transform duration-300 ease-in-out"
     [class.translate-y-[150%]]="!isVisible()">
    <div class="relative z-10 h-full w-full flex justify-around items-center">
        @for (item of navItems; track item.path) {
            <a [routerLink]="item.path"
               routerLinkActive="active-nav-item"
               class="relative flex flex-col items-center justify-center w-1/5 h-full text-gray-400 transition-all duration-300 hover:text-white group">
                <div [innerHTML]="item.icon" class="transition-all duration-300 group-hover:scale-110"></div>
                <span class="text-xs mt-1 transition-all duration-300">{{ item.label }}</span>
            </a>
        }
    </div>
</nav>

<style>
  .active-nav-item {
    color: var(--theme-color-primary);
    transform: translateY(-4px) scale(1.05);
    text-shadow: 0 0 8px var(--theme-color-primary);
  }
  .active-nav-item div {
    filter: drop-shadow(0 0 8px var(--theme-color-primary));
  }

  .active-nav-item::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    width: 65px;
    height: 65px;
    background: radial-gradient(circle, color-mix(in srgb, var(--theme-color-primary) 25%, transparent) 0%, transparent 65%);
    border-radius: 50%;
    z-index: -1;
    animation: nav-glow-pulse 2.5s infinite ease-in-out;
  }
  
  @keyframes nav-glow-pulse {
    0%, 100% { 
        opacity: calc(var(--nav-lighting-opacity, 0.8) * 0.8);
        transform: translate(-50%, -50%) scale(1); 
    }
    50% { 
        opacity: var(--nav-lighting-opacity, 0.8); 
        transform: translate(-50%, -50%) scale(1.05); 
    }
  }
</style>
