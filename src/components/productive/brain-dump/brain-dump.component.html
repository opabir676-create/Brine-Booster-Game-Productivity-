<div class="flex flex-col gap-8 animate-futuristic-fade-in max-w-4xl mx-auto">
  <header>
    <a routerLink="/productive" class="inline-flex items-center gap-2 text-sm text-cyan-400 hover:text-cyan-300 transition-colors mb-2">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5">
        <path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 0 1-.02 1.06L8.832 10l3.938 3.71a.75.75 0 1 1-1.04 1.08l-4.5-4.25a.75.75 0 0 1 0-1.08l4.5-4.25a.75.75 0 0 1 1.06.02Z" clip-rule="evenodd" />
      </svg>
      Back to Tools
    </a>
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-3xl font-bold text-white text-glow" [style.color]="'var(--theme-color-primary)'">Brain Dump</h1>
        <p class="text-gray-400">A clear space for your thoughts.</p>
      </div>
      <button (click)="clearContent()" class="futuristic-btn btn-danger">Clear</button>
    </div>
  </header>

  <section class="futuristic-card p-1">
    <div class="card-content h-full w-full">
      <textarea 
        class="relative z-10 w-full h-[60vh] bg-transparent futuristic-input !border-none !shadow-none !ring-0 !outline-none text-lg p-4" 
        placeholder="Start typing..." 
        [ngModel]="content()"
        (ngModelChange)="content.set($event)">
      </textarea>
    </div>
  </section>

  <footer class="text-center text-gray-400">
    <span>{{ charCount() }} characters</span>
    <span class="mx-2">|</span>
    <span>{{ wordCount() }} words</span>
  </footer>
</div>
