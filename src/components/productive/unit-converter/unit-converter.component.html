<div class="flex flex-col gap-8 animate-futuristic-fade-in max-w-2xl mx-auto">
  <header>
     <a routerLink="/productive" class="inline-flex items-center gap-2 text-sm text-cyan-400 hover:text-cyan-300 transition-colors mb-2">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5"><path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 0 1-.02 1.06L8.832 10l3.938 3.71a.75.75 0 1 1-1.04 1.08l-4.5-4.25a.75.75 0 0 1 0-1.08l4.5-4.25a.75.75 0 0 1 1.06.02Z" clip-rule="evenodd" /></svg>
        Back to Tools
      </a>
    <h1 class="text-3xl font-bold text-white text-glow" [style.color]="'var(--theme-color-primary)'">Unit Converter</h1>
    <p class="text-gray-400">A quick and easy tool for your conversion needs.</p>
  </header>

  <section class="futuristic-card p-5">
    <div class="card-content">
      <div class="relative z-10 flex flex-col gap-4">
        <div class="flex gap-2 bg-black/40 p-1.5 rounded-full">
          <button class="flex-1 px-4 py-2 text-sm font-semibold rounded-full transition-colors" [class.text-black]="category() === 'length'" [style.background-color]="category() === 'length' ? 'var(--theme-color-primary)' : 'transparent'" (click)="onCategoryChange('length')">Length</button>
          <button class="flex-1 px-4 py-2 text-sm font-semibold rounded-full transition-colors" [class.text-black]="category() === 'weight'" [style.background-color]="category() === 'weight' ? 'var(--theme-color-primary)' : 'transparent'" (click)="onCategoryChange('weight')">Weight</button>
          <button class="flex-1 px-4 py-2 text-sm font-semibold rounded-full transition-colors" [class.text-black]="category() === 'temperature'" [style.background-color]="category() === 'temperature' ? 'var(--theme-color-primary)' : 'transparent'" (click)="onCategoryChange('temperature')">Temperature</button>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-3 items-center gap-4">
          <!-- From -->
          <div class="flex flex-col gap-2">
            <input type="number" [ngModel]="inputValue()" (ngModelChange)="inputValue.set($event)" class="futuristic-input w-full text-lg">
            <select [ngModel]="fromUnit()" (ngModelChange)="fromUnit.set($event)" class="futuristic-input w-full capitalize">
              @for(unit of availableUnits(); track unit.name) {
                <option [value]="unit.name">{{ unit.name }}</option>
              }
            </select>
          </div>
          
          <div class="text-center text-4xl font-bold" [style.color]="'var(--theme-color-primary)'">=</div>

          <!-- To -->
          <div class="flex flex-col gap-2">
            <div class="futuristic-input w-full text-lg min-h-[46px] flex items-center">
                {{ result().toLocaleString(undefined, { maximumFractionDigits: 4 }) }}
            </div>
            <select [ngModel]="toUnit()" (ngModelChange)="toUnit.set($event)" class="futuristic-input w-full capitalize">
              @for(unit of availableUnits(); track unit.name) {
                <option [value]="unit.name">{{ unit.name }}</option>
              }
            </select>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
