<div class="flex flex-col gap-8 animate-futuristic-fade-in max-w-2xl mx-auto">
  <header>
     <a routerLink="/productive" class="inline-flex items-center gap-2 text-sm text-cyan-400 hover:text-cyan-300 transition-colors mb-2">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5"><path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 0 1-.02 1.06L8.832 10l3.938 3.71a.75.75 0 1 1-1.04 1.08l-4.5-4.25a.75.75 0 0 1 0-1.08l4.5-4.25a.75.75 0 0 1 1.06.02Z" clip-rule="evenodd" /></svg>
        Back to Tools
      </a>
    <h1 class="text-3xl font-bold text-white text-glow" [style.color]="'var(--theme-color-primary)'">Password Generator</h1>
    <p class="text-gray-400">Create strong, secure passwords for your online accounts.</p>
  </header>

  <section class="futuristic-card p-5">
    <div class="card-content">
      <div class="relative z-10 flex flex-col gap-4">
        <h2 class="text-xl font-semibold mb-2" [style.color]="'var(--theme-color-primary)'">Generated Password</h2>
        <div class="relative">
          <input type="text" [value]="password()" readonly class="futuristic-input w-full text-lg pr-12 font-mono">
          <button (click)="copyPassword()" class="absolute right-2 top-1/2 -translate-y-1/2 p-2 rounded-full hover:bg-white/20 transition-colors">
            @if(isCopied()) {
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-6 h-6 text-green-400"><path fill-rule="evenodd" d="M16.704 4.153a.75.75 0 0 1 .143 1.052l-8 10.5a.75.75 0 0 1-1.127.075l-4.5-4.5a.75.75 0 0 1 1.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 0 1 1.052-.143Z" clip-rule="evenodd" /></svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-6 h-6"><path d="M7 3.5A1.5 1.5 0 0 1 8.5 2h3.879a1.5 1.5 0 0 1 1.06.44l3.122 3.121A1.5 1.5 0 0 1 17 6.621V16.5a1.5 1.5 0 0 1-1.5 1.5h-7A1.5 1.5 0 0 1 7 16.5v-13Zm0 0V.5a.5.5 0 0 1 .5-.5h3.879a.5.5 0 0 1 .353.146l3.122 3.121a.5.5 0 0 1 .146.354V16.5a.5.5 0 0 1-.5.5h-7a.5.5 0 0 1-.5-.5v-13Z" /><path d="M4.5 4.5A1.5 1.5 0 0 0 3 6v10.5A1.5 1.5 0 0 0 4.5 18h7a1.5 1.5 0 0 0 1.5-1.5v-3a.75.75 0 0 1-1.5 0v3a.5.5 0 0 1-.5.5h-7a.5.5 0 0 1-.5-.5V6a.5.5 0 0 1 .5-.5h3a.75.75 0 0 1 0-1.5h-3Z" /></svg>
            }
          </button>
        </div>
        <button (click)="generatePassword()" class="futuristic-btn btn-primary w-full">Generate New</button>
      </div>
    </div>
  </section>

  <section class="futuristic-card p-5">
    <div class="card-content">
      <div class="relative z-10 flex flex-col gap-4">
        <h2 class="text-xl font-semibold" [style.color]="'var(--theme-color-primary)'">Options</h2>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">Password Length: {{ length() }}</label>
          <input type="range" min="8" max="32" [value]="length()" (input)="length.set($event.target.valueAsNumber)">
        </div>
        <div class="flex justify-between items-center">
          <label class="text-sm font-medium text-gray-300">Include Uppercase (A-Z)</label>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" [checked]="includeUppercase()" (change)="includeUppercase.set($event.target.checked)" class="sr-only peer">
            <div class="w-11 h-6 bg-gray-700 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border after:rounded-full after:h-5 after:w-5 after:transition-all" [style.background-color]="includeUppercase() ? 'var(--theme-color-primary)' : ''"></div>
          </label>
        </div>
        <div class="flex justify-between items-center">
          <label class="text-sm font-medium text-gray-300">Include Numbers (0-9)</label>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" [checked]="includeNumbers()" (change)="includeNumbers.set($event.target.checked)" class="sr-only peer">
            <div class="w-11 h-6 bg-gray-700 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border after:rounded-full after:h-5 after:w-5 after:transition-all" [style.background-color]="includeNumbers() ? 'var(--theme-color-primary)' : ''"></div>
          </label>
        </div>
        <div class="flex justify-between items-center">
          <label class="text-sm font-medium text-gray-300">Include Symbols (!@#...)</label>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" [checked]="includeSymbols()" (change)="includeSymbols.set($event.target.checked)" class="sr-only peer">
            <div class="w-11 h-6 bg-gray-700 rounded-full peer peer-checked:after:translate-x-full after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border after:rounded-full after:h-5 after:w-5 after:transition-all" [style.background-color]="includeSymbols() ? 'var(--theme-color-primary)' : ''"></div>
          </label>
        </div>
      </div>
    </div>
  </section>
</div>
