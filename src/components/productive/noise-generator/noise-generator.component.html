<div class="flex flex-col gap-8 animate-futuristic-fade-in max-w-2xl mx-auto">
  <header>
     <a routerLink="/productive" class="inline-flex items-center gap-2 text-sm text-cyan-400 hover:text-cyan-300 transition-colors mb-2">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5"><path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 0 1-.02 1.06L8.832 10l3.938 3.71a.75.75 0 1 1-1.04 1.08l-4.5-4.25a.75.75 0 0 1 0-1.08l4.5-4.25a.75.75 0 0 1 1.06.02Z" clip-rule="evenodd" /></svg>
        Back to Tools
      </a>
    <h1 class="text-3xl font-bold text-white text-glow" [style.color]="'var(--theme-color-primary)'">Noise Generator</h1>
    <p class="text-gray-400">Block out distractions and find your focus.</p>
  </header>

  <section class="futuristic-card p-5">
    <div class="card-content">
      <div class="relative z-10">
        <h2 class="text-xl font-semibold mb-4" [style.color]="'var(--theme-color-primary)'">Select a Sound</h2>
        <div class="grid grid-cols-3 gap-4">
          @for(sound of sounds; track sound.type) {
            <button 
              (click)="toggleSound(sound.type)"
              class="futuristic-card p-4 flex flex-col items-center gap-2 justify-center aspect-square transition-all"
              [class.border-cyan-400]="activeSound() === sound.type"
              [style.border-color]="activeSound() === sound.type ? 'var(--theme-color-primary)' : ''"
              [class.bg-cyan-500/20]="activeSound() === sound.type"
              [style.background-color]="activeSound() === sound.type ? 'color-mix(in srgb, var(--theme-color-primary) 20%, transparent)' : ''"
              >
              <span class="text-5xl">{{ sound.icon }}</span>
              <span class="font-semibold">{{ sound.name }}</span>
            </button>
          }
        </div>
      </div>
    </div>
  </section>

  <section class="futuristic-card p-5">
    <div class="card-content">
      <div class="relative z-10">
         <label for="volume" class="block text-sm font-medium text-gray-300 mb-2">Volume: {{ (volume() * 100).toFixed(0) }}%</label>
         <input 
           type="range" 
           id="volume" 
           min="0" 
           max="1" 
           step="0.01" 
           [value]="volume()" 
           (input)="onVolumeChange($event)">
      </div>
    </div>
  </section>

</div>
