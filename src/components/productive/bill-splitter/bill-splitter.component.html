<div class="flex flex-col gap-8 animate-futuristic-fade-in max-w-2xl mx-auto">
  <header>
     <a routerLink="/productive" class="inline-flex items-center gap-2 text-sm text-cyan-400 hover:text-cyan-300 transition-colors mb-2">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5"><path fill-rule="evenodd" d="M12.79 5.23a.75.75 0 0 1-.02 1.06L8.832 10l3.938 3.71a.75.75 0 1 1-1.04 1.08l-4.5-4.25a.75.75 0 0 1 0-1.08l4.5-4.25a.75.75 0 0 1 1.06.02Z" clip-rule="evenodd" /></svg>
        Back to Tools
      </a>
    <h1 class="text-3xl font-bold text-white text-glow" [style.color]="'var(--theme-color-primary)'">Bill Splitter</h1>
    <p class="text-gray-400">Easily calculate how to split the check.</p>
  </header>

  <!-- Inputs -->
  <section class="futuristic-card p-5">
    <div class="card-content">
      <div class="relative z-10 space-y-6">
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">Bill Amount</label>
          <input type="number" placeholder="0.00" [ngModel]="billAmount()" (ngModelChange)="billAmount.set($event)" class="futuristic-input w-full text-lg">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">Tip Percentage: {{ tipPercentage() }}%</label>
          <input type="range" min="0" max="30" [value]="tipPercentage()" (input)="tipPercentage.set($event.target.valueAsNumber)">
        </div>
         <div>
          <label class="block text-sm font-medium text-gray-300 mb-2">Number of People: {{ numberOfPeople() }}</label>
          <input type="range" min="1" max="20" [value]="numberOfPeople()" (input)="numberOfPeople.set($event.target.valueAsNumber)">
        </div>
      </div>
    </div>
  </section>

  <!-- Results -->
  <section class="futuristic-card p-5">
    <div class="card-content">
      <div class="relative z-10 space-y-4">
        <h2 class="text-xl font-semibold mb-2" [style.color]="'var(--theme-color-primary)'">Results</h2>
        <div class="flex justify-between items-center bg-black/30 p-3 rounded-lg">
          <span class="text-gray-400">Tip Amount</span>
          <span class="font-bold text-lg">{{ tipAmount() | number:'1.2-2' }}</span>
        </div>
        <div class="flex justify-between items-center bg-black/30 p-3 rounded-lg">
          <span class="text-gray-400">Total Bill</span>
          <span class="font-bold text-lg">{{ totalAmount() | number:'1.2-2' }}</span>
        </div>
        <div class="mt-4 p-4 rounded-lg border-2 border-dashed" [style.border-color]="'var(--theme-color-primary)'">
            <div class="flex justify-between items-center">
                <p class="font-bold text-lg">Each Person Pays</p>
                <p class="font-mono font-bold text-2xl" [style.color]="'var(--theme-color-primary)'">{{ perPersonAmount() | number:'1.2-2' }}</p>
            </div>
        </div>
      </div>
    </div>
  </section>
</div>
